name = "uploud-api"
main = "worker.js"
compatibility_date = "2024-03-20"

# Przypinamy Twój dysk (Bucket) z Cloudflare
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "przecho" 

# Zmienne środowiskowe, które Cloudflare musi znać
[vars]
ACCOUNT_ID = "TUTAJ_WKLEJ_SWOJE_ACCOUNT_ID"
BUCKET_NAME = "przecho"
